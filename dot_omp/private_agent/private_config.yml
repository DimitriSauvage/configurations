providers:
  autoThinkingMaxEffort: max
setupVersion: 2
theme:
  dark: dark-github
  light: light
colorBlindMode: false
composer:
  shape: pi
  tokenRate: true
statusLine:
  preset: default
  sessionAccent: true
  separator: powerline
  transparent: false
  compactThinkingLevel: true
  showHookStatus: true
tui:
  hyperlinks: auto
terminal:
  showProgress: true
defaultThinkingLevel: auto
hideThinkingBlock: true
proseOnlyThinking: false
cycleOrder:
  - smol
  - default
  - slow
  - plan
modelRoles:
  commit: ollama/commit-bot:latest
  tiny: ollama/qwen2.5-coder:7b
  smol: ~z-ai/glm-flash-latest:low
  advisor: openrouter/~z-ai/glm-flash-latest
  default: openrouter/~z-ai/glm-flash-latest:max
  slow: openrouter/~deepseek/deepseek-v4-flash-latest:max
  vision: openrouter/qwen/qwen3.8-max:auto
  task: openrouter/~z-ai/glm-flash-latest:auto
  plan: openrouter/~deepseek/deepseek-v4-flash-latest:max
autolearn:
  enabled: true
memory:
  backend: "off"
paste:
  largeMenuThreshold: 200
advisor:
  enabled: true
steeringMode: all
interruptMode: immediate
plan:
  defaultOnStartup: false
task:
  eager: always
  enableLsp: true
  maxRecursionDepth: -1
  isolation:
    enabled: true
isolation:
  backend: auto
commands:
  enableOpencodeUser: false
dev:
  autoqaConsent: granted
display:
  subagentLivePreview: true
spelling:
  autocomplete: smollm
  autocorrect: true